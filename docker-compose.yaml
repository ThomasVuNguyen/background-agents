      - MODAL_TOKEN_SECRET=${MODAL_TOKEN_SECRET}
    volumes:
      - openinspect_data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.controlplane-ramp.rule=Host(`ramp.beenex.org`) && (PathPrefix(`/sessions`) || PathPrefix(`/internal`))"
      - "traefik.http.routers.controlplane-ramp.entryPoints=websecure"
      - "traefik.http.routers.controlplane-ramp.tls=true"
      - "traefik.http.routers.controlplane-ramp.tls.certresolver=letsencrypt"
      - "traefik.http.routers.controlplane-ramp.priority=100"
      - "traefik.http.services.controlplane-ramp.loadbalancer.server.port=8787"
    ports:
      - "8787:8787"

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3000
      - CONTROL_PLANE_URL=http://control-plane:8787
      - NEXT_PUBLIC_WS_URL=wss://ramp.beenex.org
      - SERVICE_AUTH_SECRET=${SERVICE_AUTH_SECRET_WEB:-default-service-auth-secret-web-key-1234}
    depends_on:
      - control-plane
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web-ramp.rule=Host(`ramp.beenex.org`)"
      - "traefik.http.routers.web-ramp.entryPoints=websecure"
      - "traefik.http.routers.web-ramp.tls=true"
      - "traefik.http.routers.web-ramp.tls.certresolver=letsencrypt"
      - "traefik.http.routers.web-ramp.priority=10"
      - "traefik.http.services.web-ramp.loadbalancer.server.port=3000"
    ports:
      - "3000:3000"

volumes:
  openinspect_data:

networks:
  default:
    name: coolify
    external: true
