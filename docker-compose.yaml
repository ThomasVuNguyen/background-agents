# =============================================================================
# Open-Inspect — Production Docker Deployment (Coolify / self-hosted)
# =============================================================================
# This is the ACTUAL deployment config for this fork. See DEPLOYMENT.md for full
# documentation. This runs on a self-hosted server behind Traefik (via Coolify)
# at ramp.beenex.org.
#
# NOTE: The terraform/ directory and .github/workflows/ are upstream artifacts
# and are NOT used by this deployment.
# =============================================================================

services:
  control-plane:
    build:
      context: .
      dockerfile: packages/control-plane/Dockerfile
    restart: unless-stopped
    environment:
      - PORT=8787
      - DATA_DIR=/data
      - DEPLOYMENT_NAME=coolify-lenovo
      - APP_NAME=Open-Inspect
      - WORKER_URL=https://ramp.beenex.org
      - WEB_APP_URL=https://ramp.beenex.org
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - PROVIDER_ACCOUNTS_ENCRYPTION_KEY=${PROVIDER_ACCOUNTS_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - REPO_SECRETS_ENCRYPTION_KEY=${REPO_SECRETS_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
